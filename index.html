<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff8ed">
<title>のびろ！ポンデケージョ</title>
<style>
:root{--cream:#fff8ed;--ink:#28231f;--orange:#e7a04b;--brown:#8c542b;--pink:#efb4a7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;min-height:100dvh}
.app{width:min(100%,520px);min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:#8d7867}
.logo{font-size:12px;font-weight:800}
.best{background:#fff;border:1px solid #f0e4d5;border-radius:999px;padding:8px 12px;letter-spacing:0}
h1{font-size:clamp(27px,7vw,36px);line-height:1.2;text-align:center;margin:24px 0 7px;font-weight:900;letter-spacing:-.04em}
.sub{text-align:center;color:#8d7867;font-size:13px;margin:0 0 16px}
.scoreline{display:flex;align-items:baseline;gap:5px;margin:0 0 3px}
#score{font-size:52px;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.unit{font-size:14px;font-weight:700;color:#8d7867}
.status{font-size:12px;font-weight:800;letter-spacing:.14em;color:#b17a3c;height:20px}
.playfield{width:100%;height:270px;position:relative;touch-action:none;user-select:none;margin:8px 0 12px;border-radius:24px;background:linear-gradient(180deg,#fffdf8,#fff2dd);border:1px solid #f1e0ca;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hint{font-size:13px;color:#7d6a5a;text-align:center;line-height:1.7;min-height:44px;margin-bottom:14px}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
#start{width:100%;border-radius:16px;background:var(--ink);color:white;font-weight:800;padding:17px 18px;font-size:16px;box-shadow:0 5px 0 #c8b7a4;transition:transform .08s,box-shadow .08s}
#start:active{transform:translateY(3px);box-shadow:0 2px 0 #c8b7a4}
#start:disabled{opacity:.5}
.tips{display:flex;gap:8px;width:100%;margin-top:20px}
.tip{flex:1;background:#fff;border:1px solid #f0e4d5;border-radius:14px;padding:12px 8px;text-align:center;font-size:11px;color:#8d7867;line-height:1.6}
.tip b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px}
.footer{margin-top:auto;padding-top:20px;font-size:10px;color:#b4a18e;letter-spacing:.08em}
@media(max-height:700px){h1{margin-top:14px}.playfield{height:230px}.tips{margin-top:10px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><span class="logo">PON DE KEIJO LAB.</span><span class="best">BEST <b id="best">0.0</b> cm</span></div>
  <h1>のびろ！<br>ポンデケージョ</h1>
  <p class="sub">ちぎれる、その瞬間まで。</p>
  <div class="scoreline"><span id="score">0.0</span><span class="unit">cm</span></div>
  <div class="status" id="status">READY?</div>
  <div class="playfield" id="field"><canvas id="game"></canvas></div>
  <div class="hint" id="hint">スタートしたら、ポンデケージョを<br>右へスワイプして引っ張ろう！</div>
  <button id="start">ひっぱる！</button>
  <div class="tips">
    <div class="tip"><b>👆 スワイプ</b>右へ引っ張る</div>
    <div class="tip"><b>🧀 のびのび</b>ゆっくり慎重に</div>
    <div class="tip"><b>💥 限界突破</b>ちぎれたら終了</div>
  </div>
  <div class="footer">STRETCH IT. DON'T SNACK IT.</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const field=document.getElementById('field'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),hintEl=document.getElementById('hint'),startBtn=document.getElementById('start');
let W=0,H=0,dpr=1,mode='ready',pull=0,score=0,best=0,startX=0,pullStart=0,pointerId=null,burst=0,shake=0,particles=[],last=0;
try{best=Number(localStorage.getItem('pondekeijo-best')||0)}catch(e){}
bestEl.textContent=best.toFixed(1);
function resize(){const r=field.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
window.addEventListener('resize',resize);
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function bread(x,y,rx,ry,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);
 let g=ctx.createRadialGradient(-rx*.28,-ry*.35,2,0,0,Math.max(rx,ry)*1.2);g.addColorStop(0,'#ffe7a1');g.addColorStop(.55,'#efb45e');g.addColorStop(1,'#c77c34');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,248,219,.8)';ctx.lineWidth=Math.max(1,rx*.045);ctx.beginPath();ctx.arc(-rx*.08,-ry*.08,Math.min(rx,ry)*.65,3.6,5.1);ctx.stroke();
 for(let i=0;i<Math.max(3,Math.floor(rx/7));i++){let a=i*2.4+1;let px=Math.cos(a)*rx*.48,py=Math.sin(a)*ry*.45;ctx.fillStyle='rgba(154,87,33,.35)';ctx.beginPath();ctx.ellipse(px,py,Math.max(1,rx*.025),Math.max(1,ry*.025),a,0,Math.PI*2);ctx.fill()}
 ctx.restore()}
function draw(){
 ctx.clearRect(0,0,W,H);
 // quiet dotted background
 ctx.fillStyle='rgba(203,157,100,.15)';for(let x=16;x<W;x+=28)for(let y=18;y<H;y+=28){ctx.beginPath();ctx.arc(x,y,1.1,0,Math.PI*2);ctx.fill()}
 const cy=H*.53, left=W*.20, right=Math.min(W*.80,left+pull*W*.52);
 // shadow
 ctx.fillStyle='rgba(110,75,43,.08)';ctx.beginPath();ctx.ellipse(left+pull*W*.24,cy+44,Math.min(100,35+pull*W*.16),7,0,0,Math.PI*2);ctx.fill();
 if(mode==='broken'){
   bread(left,cy,38,34,-.15);
   // snapped strand
   ctx.strokeStyle='#d99a4e';ctx.lineWidth=4;ctx.lineCap='round';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(left+27,cy-2);ctx.lineTo(left+58,cy-12);ctx.stroke();ctx.setLineDash([]);
   bread(right,cy-8,25,20,.2);
   particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);bread(p.x,p.y,4,3,p.rot);ctx.globalAlpha=1});
 } else {
   // stretch cheese dough
   if(pull>0.02){
     const thick=Math.max(3,18-pull*11);
     const mid=(left+right)/2;
     ctx.beginPath();ctx.moveTo(left+24,cy);ctx.bezierCurveTo(left+55,cy-8,right-35,cy+8,right-15,cy);
     ctx.strokeStyle='#d58b3d';ctx.lineWidth=thick+4;ctx.lineCap='round';ctx.stroke();
     ctx.beginPath();ctx.moveTo(left+24,cy-1);ctx.bezierCurveTo(left+55,cy-8,right-35,cy+8,right-15,cy-1);
     ctx.strokeStyle='#f4c875';ctx.lineWidth=thick;ctx.stroke();
     // glossy highlight
     ctx.beginPath();ctx.moveTo(left+32,cy-thick*.25);ctx.quadraticCurveTo(mid,cy-thick*.45,right-20,cy-thick*.2);ctx.strokeStyle='rgba(255,244,197,.8)';ctx.lineWidth=Math.max(1,thick*.16);ctx.stroke();
   }
   bread(left,cy,38,34,-.05-pull*.08);
   bread(right,cy,Math.max(18,35-pull*10),Math.max(18,31-pull*8),.08+pull*.18);
   if(mode==='playing'&&pull>.45){ctx.fillStyle='#b77c38';ctx.font='800 12px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(pull>.8?'やばい！':'いい感じ',W*.5,cy-65)}
 }
}
function updateScore(){score=pull*100;scoreEl.textContent=score.toFixed(1)}
function begin(){mode='playing';pull=0;score=0;particles=[];statusEl.textContent='PULL!';hintEl.innerHTML='画面を押したまま、右へスワイプ！<br>急に引っ張りすぎると、ちぎれるで…';startBtn.textContent='指で引っ張って！';startBtn.disabled=true;draw();updateScore()}
function endGame(){mode='broken';burst=1;shake=7;statusEl.textContent='BROKEN!';hintEl.innerHTML=`記録 <b>${score.toFixed(1)} cm</b>！ もう一回、限界に挑戦しよ。`;if(score>best){best=score;bestEl.textContent=best.toFixed(1);try{localStorage.setItem('pondekeijo-best',String(best))}catch(e){}hintEl.innerHTML=`🎉 NEW BEST！ <b>${score.toFixed(1)} cm</b><br>記録更新や！もう一回いく？`}startBtn.disabled=false;startBtn.textContent='もう一回！';for(let i=0;i<18;i++)particles.push({x:W*.55,y:H*.53,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:1,rot:Math.random()*3});draw()}
function pos(e){const r=field.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
field.addEventListener('pointerdown',e=>{if(mode!=='playing')return;pointerId=e.pointerId;startX=pos(e).x;pullStart=pull;field.setPointerCapture(pointerId);e.preventDefault()});
field.addEventListener('pointermove',e=>{if(mode!=='playing'||pointerId!==e.pointerId)return;const p=pos(e);const delta=Math.max(0,p.x-startX);const next=Math.min(1.08,pullStart+delta/(W*.58));pull=Math.max(pull,next);updateScore();draw();if(pull>=1){endGame();pointerId=null}e.preventDefault()});
function release(e){if(pointerId===e.pointerId){pointerId=null;if(mode==='playing'&&pull>.02){statusEl.textContent='KEEP GOING';hintEl.innerHTML='まだちぎれてへんで！<br>もう一度、右へ引っ張ろう。'}}}
field.addEventListener('pointerup',release);field.addEventListener('pointercancel',release);
startBtn.addEventListener('click',()=>{if(mode!=='playing')begin()});
function loop(t){const dt=Math.min(32,t-last||16);last=t;if(mode==='broken'&&particles.length){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=dt/950});particles=particles.filter(p=>p.life>0);draw()}requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
